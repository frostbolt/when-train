services:
  backend:
    build: ./packages/backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # GTFS download takes ~10 s on first start

  frontend:
    build: ./packages/frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" → plain HTTP locally. Set SITE_ADDRESS to your domain (e.g. in
      # .env on the server) to get automatic HTTPS via Let's Encrypt.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data      # ACME certs/keys — must persist across restarts
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
